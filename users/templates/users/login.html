{% extends "blog/base.html" %}
{% block content %}
    <div class="form-container">
        <form method="POST">
            {% csrf_token %}
            <fieldset>
                <legend>ログイン</legend>
                {{ form.as_p }}
            </fieldset>
            <div>
                <button type="submit">ログイン</button>
            </div>
        </form>
        <div class="form-footer">
            <small>
                アカウントをお持ちでない方は <a href="{% url 'register' %}">登録</a>
            </small>
        </div>
    </div>
{% endblock %}
