{% extends "blog/base.html" %}
{% block content %}
    <div class="form-container">
        <form method="POST">
            {% csrf_token %}
            <fieldset>
                <legend>アカウント登録</legend>
                {{ form.as_p }}
            </fieldset>
            <div>
                <button type="submit">登録</button>
            </div>
        </form>
        <div class="form-footer">
            <small>
                既にアカウントをお持ちの方は <a href="{% url 'login' %}">ログイン</a>
            </small>
        </div>
    </div>
{% endblock %}
