{% extends "blog/base.html" %}
{% block title %}{{ object.title }}{% endblock %}
{% block content %}
    <article>
        <h1>{{ object.title }}</h1>
        <p class="post-meta">{{ object.date_posted|date:"Y年m月d日" }} by {{ object.author }}</p>
        {% if object.author == user %}
            <div class="post-actions">
                <a href="{% url 'post-update' object.id %}">編集</a>
                <a href="{% url 'post-delete' object.id %}">削除</a>
            </div>
        {% endif %}
        <div>{{ object.content }}</div>
    </article>
    <p><a href="{% url 'blog-home' %}">← ホームに戻る</a></p>
{% endblock %}
