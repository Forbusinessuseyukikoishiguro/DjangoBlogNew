<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <h1><a href="{% url 'blog-home' %}">AIエンジニア転職を目指して勉強するブログ</a></h1>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: 0 auto; }
        header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        article { margin-bottom: 30px; }
        h1 { color: #333; }
        .post-meta { color: #666; font-size: 0.9em; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        
        /* ナビゲーション */
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; }
        
        /* フォーム */
        .form-container { max-width: 500px; }
        fieldset { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; }
        legend { padding: 0 10px; font-weight: bold; }
        label { display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ddd; }
        button { padding: 8px 15px; background: #0066cc; color: white; border: none; cursor: pointer; }
        button:hover { background: #0055aa; }
        .form-footer { margin-top: 15px; }
        
        /* メッセージ */
        .messages { margin-bottom: 20px; }
        .alert { padding: 10px; margin-bottom: 10px; border-radius: 3px; }
        .alert-success { background-color: #dff0d8; color: #3c763d; border: 1px solid #d6e9c6; }
        .alert-error { background-color: #f2dede; color: #a94442; border: 1px solid #ebccd1; }
        
        /* 投稿アクション */
        .post-actions { margin-bottom: 15px; }
        .post-actions a { margin-right: 10px; padding: 3px 8px; background: #f8f8f8; border: 1px solid #ddd; }
        
        /* ページネーション */
        .pagination { margin: 30px 0; text-align: center; }
        .pagination a, .pagination span { padding: 5px 10px; margin: 0 3px; border: 1px solid #ddd; }
        .pagination .current { background: #0066cc; color: white; border-color: #0066cc; }
    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'blog-home' %}">My Blog</a></h1>
        <nav>
            <a href="{% url 'blog-home' %}">ホーム</a>
            {% if user.is_authenticated %}
                <a href="{% url 'post-create' %}">新規投稿</a>
                <a href="{% url 'profile' %}">プロフィール</a>
                <a href="{% url 'logout' %}">ログアウト</a>
            {% else %}
                <a href="{% url 'login' %}">ログイン</a>
                <a href="{% url 'register' %}">登録</a>
            {% endif %}
        </nav>
    </header>
    
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
