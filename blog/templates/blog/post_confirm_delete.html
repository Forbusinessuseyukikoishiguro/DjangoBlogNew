{% extends "blog/base.html" %}
{% block content %}
    <div class="form-container">
        <form method="POST">
            {% csrf_token %}
            <fieldset>
                <legend>投稿の削除</legend>
                <h2>「{{ object.title }}」を削除しますか？</h2>
            </fieldset>
            <div>
                <button type="submit">はい、削除します</button>
                <a href="{% url 'post-detail' object.id %}">キャンセル</a>
            </div>
        </form>
    </div>
{% endblock %}
